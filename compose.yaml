services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clientes_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d clientes_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clientes_db
      DB_USER: app
      DB_PASSWORD: app_dev_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

volumes:
  postgres_data:
    name: docker_clientes_postgres_data

networks:
  app_net:
    name: docker_clientes_network
    driver: bridge
